name: CursoHub Auth Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentication-smoke:
    name: API + PostgreSQL + JWT
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cursohub_ci
          POSTGRES_USER: cursohub
          POSTGRES_PASSWORD: cursohub_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cursohub -d cursohub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cursohub_ci
      DB_USER: cursohub
      DB_PASSWORD: cursohub_ci_only
      FLYWAY_LOCATIONS: classpath:db/migration
      PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Gerar chave JWT temporaria para CI
        shell: bash
        run: |
          key=$(openssl rand -base64 32 | tr -d '\n')
          echo "::add-mask::$key"
          echo "JWT_SECRET_BASE64=$key" >> "$GITHUB_ENV"
      - name: Verificar unicidade das versões Flyway (inclusive demonstração)
        shell: bash
        run: |
          set -euo pipefail
          find backend/src/main/resources/db -type f -name 'V*__*.sql' -print | sort | awk -F/ '
            {
              filename=$NF
              split(filename, pieces, "__")
              version=pieces[1]
              if (seen[version] != "") {
                print "Versão Flyway duplicada: " version
                print "  " seen[version]
                print "  " $0
                bad=1
              } else {
                seen[version]=$0
              }
            }
            END { if (bad) exit 1; print "Todas as versões Flyway são únicas." }
          '
      - name: Smoke test PostgreSQL + JWT
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mvn -B -ntp spring-boot:run > /tmp/cursohub-integration.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health | jq -e '.status == "UP"' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "A API nao iniciou corretamente. Log:"
            tail -100 /tmp/cursohub-integration.log
            exit 1
          fi

          code=$(curl -sS -o /tmp/noauth.json -w '%{http_code}' http://localhost:8080/api/v1/auth/me)
          [[ "$code" == "401" ]] || { echo "GET /auth/me sem token: $code (esperado 401)"; exit 1; }

          payload='{"name":"Aluno CI","email":"  ALUNO.CI@example.com  ","password":"SenhaForteCI#2026"}'
          code=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$payload" http://localhost:8080/api/v1/auth/register)
          [[ "$code" == "201" ]] || { echo "POST /register: $code (esperado 201)"; cat /tmp/register.json; exit 1; }

          jq -e '.role == "STUDENT" and .email == "aluno.ci@example.com" and (.accessToken | length > 32)' /tmp/register.json >/dev/null
          TOKEN=$(jq -r '.accessToken' /tmp/register.json)

          code=$(curl -sS -o /tmp/me.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/v1/auth/me)
          [[ "$code" == "200" ]] || { echo "GET /auth/me com token: $code (esperado 200)"; exit 1; }
          jq -e '.role == "STUDENT" and .email == "aluno.ci@example.com"' /tmp/me.json >/dev/null

          code=$(curl -sS -o /tmp/duplicate.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$payload" http://localhost:8080/api/v1/auth/register)
          [[ "$code" == "409" ]] || { echo "Cadastro duplicado: $code (esperado 409)"; exit 1; }

          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"email":"aluno.ci@example.com","password":"SenhaForteCI#2026"}' \
            http://localhost:8080/api/v1/auth/login)
          [[ "$code" == "200" ]] || { echo "Login valido: $code (esperado 200)"; exit 1; }
          jq -e '.role == "STUDENT" and (.accessToken | length > 32)' /tmp/login.json >/dev/null

          code=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"email":"aluno.ci@example.com","password":"senha-incorreta"}' \
            http://localhost:8080/api/v1/auth/login)
          [[ "$code" == "401" ]] || { echo "Login invalido: $code (esperado 401)"; exit 1; }

          code=$(curl -sS -o /tmp/catalog.json -w '%{http_code}' http://localhost:8080/api/v1/courses)
          [[ "$code" == "200" ]] || { echo "Catalogo publico: $code (esperado 200)"; exit 1; }

          # Dashboard usa exclusivamente o aluno identificado pelo JWT.
          code=$(curl -sS -o /tmp/dashboard-noauth.json -w '%{http_code}' \
            http://localhost:8080/api/v1/students/me/dashboard)
          [[ "$code" == "401" ]] || { echo "Dashboard anonimo: $code (esperado 401)"; exit 1; }

          code=$(curl -sS -o /tmp/dashboard-empty.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/v1/students/me/dashboard)
          [[ "$code" == "200" ]] || { echo "Dashboard vazio: $code (esperado 200)"; exit 1; }
          jq -e '.enrolledCourses == 0 and .inProgressCourses == 0 and .completedCourses == 0 and (.courses | length) == 0' /tmp/dashboard-empty.json >/dev/null

          # Criar massa minima somente no banco temporario do CI, sem alterar Flyway.
          STUDENT_ID=$(jq -r '.userId' /tmp/register.json)
          POSTGRES_CONTAINER=$(docker ps --filter 'ancestor=postgres:17-alpine' -q | head -1)
          [[ -n "$POSTGRES_CONTAINER" ]] || { echo "Container PostgreSQL de CI nao encontrado"; exit 1; }
          docker exec -i "$POSTGRES_CONTAINER" psql -X -U cursohub -d cursohub_ci -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO app_users(id, full_name, email, password_hash, role, is_active)
          VALUES ('11111111-1111-4111-8111-111111111111','Instrutor CI','instrutor-ci@example.com','!','INSTRUCTOR',false);
          INSERT INTO courses(id, instructor_id, slug, title, description, category, level, status, estimated_minutes, published_at)
          VALUES ('22222222-2222-4222-8222-222222222221','11111111-1111-4111-8111-111111111111',
                  'curso-teste-dashboard', 'Curso CI Dashboard','Teste de matricula','Programação',
                  'INICIANTE','PUBLICADO',60,now());
          INSERT INTO course_modules(id,course_id,title,position)
          VALUES ('33333333-3333-4333-8333-333333333331','22222222-2222-4222-8222-222222222221','Modulo 1',1);
          INSERT INTO lessons(id,module_id,title,position,kind,body_text,is_required)
          VALUES ('44444444-4444-4444-8444-444444444441','33333333-3333-4333-8333-333333333331','Aula 1',1,'TEXT','Primeira aula',true),
                 ('44444444-4444-4444-8444-444444444442','33333333-3333-4333-8333-333333333331','Aula 2',2,'TEXT','Segunda aula',true);
          INSERT INTO enrollments(id,student_id,course_id,status)
          VALUES ('55555555-5555-4555-8555-555555555551','$STUDENT_ID',
                  '22222222-2222-4222-8222-222222222221','ACTIVE');
          INSERT INTO lesson_progress(enrollment_id,lesson_id)
          VALUES ('55555555-5555-4555-8555-555555555551','44444444-4444-4444-8444-444444444441');
          SQL

          code=$(curl -sS -o /tmp/dashboard-one.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/v1/students/me/dashboard)
          [[ "$code" == "200" ]] || { echo "Dashboard matriculado: $code (esperado 200)"; exit 1; }
          jq -e '.enrolledCourses == 1 and .inProgressCourses == 1 and .completedCourses == 0 and
                 (.courses | length) == 1 and .courses[0].progressPercent == 50 and
                 .courses[0].requiredLessons == 2 and .courses[0].completedLessons == 1' /tmp/dashboard-one.json >/dev/null

          code=$(curl -sS -o /tmp/student2.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Segunda Aluna","email":"segunda.aluna@example.com","password":"SenhaForteCI#2026"}' \
            http://localhost:8080/api/v1/auth/register)
          [[ "$code" == "201" ]] || { echo "Segundo cadastro: $code"; exit 1; }
          SECOND_TOKEN=$(jq -r '.accessToken' /tmp/student2.json)
          code=$(curl -sS -o /tmp/dashboard-other.json -w '%{http_code}' \
            -H "Authorization: Bearer $SECOND_TOKEN" http://localhost:8080/api/v1/students/me/dashboard)
          [[ "$code" == "200" ]] || { echo "Segundo dashboard: $code"; exit 1; }
          jq -e '.enrolledCourses == 0 and (.courses | length) == 0' /tmp/dashboard-other.json >/dev/null

          # Matricula real: exige JWT de STUDENT e curso publicado.
          ENROLL_URL="http://localhost:8080/api/v1/courses/curso-teste-dashboard/enrollments"
          code=$(curl -sS -o /tmp/enrollment-unauth.json -w '%{http_code}' -X POST "$ENROLL_URL")
          [[ "$code" == "401" ]] || { echo "Matricula sem JWT: $code (esperado 401)"; exit 1; }

          code=$(curl -sS -o /tmp/enrollment-existing.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$ENROLL_URL")
          [[ "$code" == "200" ]] || { echo "Matricula existente: $code (esperado 200)"; cat /tmp/enrollment-existing.json; exit 1; }
          jq -e '.created == false and .status == "ACTIVE"' /tmp/enrollment-existing.json >/dev/null

          code=$(curl -sS -o /tmp/enrollment-new.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SECOND_TOKEN" "$ENROLL_URL")
          [[ "$code" == "201" ]] || { echo "Nova matricula: $code (esperado 201)"; cat /tmp/enrollment-new.json; exit 1; }
          jq -e '.created == true and .status == "ACTIVE" and (.enrollmentId | length > 30)' /tmp/enrollment-new.json >/dev/null

          code=$(curl -sS -o /tmp/enrollment-repeat.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SECOND_TOKEN" "$ENROLL_URL")
          [[ "$code" == "200" ]] || { echo "Matricula repetida: $code (esperado 200)"; exit 1; }
          jq -e --slurpfile first /tmp/enrollment-new.json \
            '.created == false and .enrollmentId == $first[0].enrollmentId' /tmp/enrollment-repeat.json >/dev/null

          code=$(curl -sS -o /tmp/second-dashboard.json -w '%{http_code}' \
            -H "Authorization: Bearer $SECOND_TOKEN" http://localhost:8080/api/v1/students/me/dashboard)
          [[ "$code" == "200" ]] || { echo "Dashboard atualizado: $code"; exit 1; }
          jq -e '.enrolledCourses == 1 and (.courses | length) == 1 and .courses[0].progressPercent == 0' /tmp/second-dashboard.json >/dev/null

          # Testa restricoes adicionais no banco temporario do CI.
          ENROLLMENT_ID=$(jq -r '.enrollmentId' /tmp/enrollment-new.json)
          docker exec -i "$POSTGRES_CONTAINER" psql -X -U cursohub -d cursohub_ci -v ON_ERROR_STOP=1 <<SQL
          UPDATE enrollments SET status = 'CANCELLED' WHERE id = '$ENROLLMENT_ID';
          SQL
          code=$(curl -sS -o /tmp/enrollment-cancelled.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SECOND_TOKEN" "$ENROLL_URL")
          [[ "$code" == "409" ]] || { echo "Matricula cancelada: $code (esperado 409)"; exit 1; }

          docker exec -i "$POSTGRES_CONTAINER" psql -X -U cursohub -d cursohub_ci -v ON_ERROR_STOP=1 <<SQL
          UPDATE courses SET status = 'ARQUIVADO' WHERE slug = 'curso-teste-dashboard';
          SQL
          code=$(curl -sS -o /tmp/enrollment-archived.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$ENROLL_URL")
          [[ "$code" == "404" ]] || { echo "Curso arquivado: $code (esperado 404)"; exit 1; }

          echo 'Smoke test OK: JWT, catalogo, dashboard, matricula idempotente, cancelamento e curso arquivado.'

          # Aulas privadas e progresso — a matricula original permanece ACTIVE.
          LESSONS_URL="http://localhost:8080/api/v1/students/me/courses/curso-teste-dashboard/lessons"
          code=$(curl -sS -o /tmp/lessons-unauth.json -w '%{http_code}' "$LESSONS_URL")
          [[ "$code" == "401" ]] || { echo "Aulas sem token: $code (esperado 401)"; exit 1; }

          code=$(curl -sS -o /tmp/lessons-owner.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$LESSONS_URL")
          [[ "$code" == "200" ]] || { echo "Aulas aluno matriculado: $code"; cat /tmp/lessons-owner.json; exit 1; }
          jq -e '.requiredLessons == 2 and .completedRequiredLessons == 1 and .progressPercent == 50 and
                 (.modules | length) == 1 and (.modules[0].lessons | length) == 2' /tmp/lessons-owner.json >/dev/null

          code=$(curl -sS -o /tmp/lessons-cancelled.json -w '%{http_code}' \
            -H "Authorization: Bearer $SECOND_TOKEN" "$LESSONS_URL")
          [[ "$code" == "404" ]] || { echo "Aulas de aluno cancelado: $code (esperado 404)"; exit 1; }

          COMPLETE_URL="$LESSONS_URL/44444444-4444-4444-8444-444444444442/complete"
          code=$(curl -sS -o /tmp/lesson-complete.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$COMPLETE_URL")
          [[ "$code" == "200" ]] || { echo "Conclusao da aula: $code"; cat /tmp/lesson-complete.json; exit 1; }
          jq -e '.newlyCompleted == true' /tmp/lesson-complete.json >/dev/null

          code=$(curl -sS -o /tmp/lesson-repeat.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$COMPLETE_URL")
          [[ "$code" == "200" ]] || { echo "Conclusao repetida: $code"; exit 1; }
          jq -e '.newlyCompleted == false' /tmp/lesson-repeat.json >/dev/null

          code=$(curl -sS -o /tmp/lessons-updated.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$LESSONS_URL")
          [[ "$code" == "200" ]] || { echo "Aulas atualizadas: $code"; exit 1; }
          jq -e '.requiredLessons == 2 and .completedRequiredLessons == 2 and .progressPercent == 100' /tmp/lessons-updated.json >/dev/null

          code=$(curl -sS -o /tmp/lesson-denied.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $SECOND_TOKEN" "$COMPLETE_URL")
          [[ "$code" == "404" ]] || { echo "Conclusao por aluno sem matricula ativa: $code (esperado 404)"; exit 1; }

          code=$(curl -sS -o /tmp/lesson-inexistent.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "$LESSONS_URL/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/complete")
          [[ "$code" == "404" ]] || { echo "Conclusao aula inexistente: $code (esperado 404)"; exit 1; }

          echo 'Smoke test OK: aulas autenticadas, isoladas por matricula e conclusao idempotente.'

          # Estudio do instrutor. Não há cadastro público de instrutor.
          # No banco isolado do CI, um usuário de teste é promovido de forma controlada.
          docker exec -i "$POSTGRES_CONTAINER" psql -X -U cursohub -d cursohub_ci -v ON_ERROR_STOP=1 <<SQL
          UPDATE app_users SET role = 'INSTRUCTOR'
           WHERE email = 'segunda.aluna@example.com' AND role = 'STUDENT';
          SQL

          code=$(curl -sS -o /tmp/instructor-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"segunda.aluna@example.com","password":"SenhaForteCI#2026"}' \
            http://localhost:8080/api/v1/auth/login)
          [[ "$code" == "200" ]] || { echo "Login instrutor: $code"; exit 1; }
          jq -e '.role == "INSTRUCTOR"' /tmp/instructor-login.json >/dev/null
          INSTRUCTOR_TOKEN=$(jq -r '.accessToken' /tmp/instructor-login.json)
          INSTRUCTOR_URL="http://localhost:8080/api/v1/instructor/courses"

          code=$(curl -sS -o /tmp/instructor-denied.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$INSTRUCTOR_URL")
          [[ "$code" == "403" ]] || { echo "Aluno acessou instrutor: $code (esperado 403)"; exit 1; }

          code=$(curl -sS -o /tmp/new-course.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"slug":"curso-publicado-instrutor-ci","title":"Curso do Instrutor CI","description":"Curso criado pelo fluxo seguro de autoria","category":"Programação","level":"INICIANTE","estimatedMinutes":90}' \
            "$INSTRUCTOR_URL")
          [[ "$code" == "201" ]] || { echo "Criar curso rascunho: $code"; cat /tmp/new-course.json; exit 1; }
          jq -e '.status == "RASCUNHO"' /tmp/new-course.json >/dev/null
          OWN_COURSE_ID=$(jq -r '.id' /tmp/new-course.json)

          # Não é possível publicar um curso sem aula obrigatória.
          code=$(curl -sS -o /tmp/publish-empty.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/publish")
          [[ "$code" == "409" ]] || { echo "Publicação sem aulas: $code (esperado 409)"; exit 1; }

          code=$(curl -sS -o /tmp/new-module.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Introdução ao Curso"}' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/modules")
          [[ "$code" == "201" ]] || { echo "Criar modulo: $code"; cat /tmp/new-module.json; exit 1; }
          MODULE_ID=$(jq -r '.id' /tmp/new-module.json)

          code=$(curl -sS -o /tmp/invalid-lesson.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Vídeo inválido","kind":"VIDEO","contentUrl":"http://example.com/video.mp4","durationSeconds":60,"required":true}' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/modules/$MODULE_ID/lessons")
          [[ "$code" == "400" ]] || { echo "Material inseguro: $code (esperado 400)"; exit 1; }

          code=$(curl -sS -o /tmp/new-lesson.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Introdução prática","kind":"TEXT","bodyText":"Conteúdo de teste escrito pelo instrutor.","durationSeconds":120,"required":true}' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/modules/$MODULE_ID/lessons")
          [[ "$code" == "201" ]] || { echo "Criar aula: $code"; cat /tmp/new-lesson.json; tail -420 /tmp/cursohub-integration.log; exit 1; }

          # Etapa 7: duas aulas posteriores + vídeo binário real de assinatura MP4
          code=$(curl -sS -o /tmp/ci-video-lesson.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Vídeo obrigatório","kind":"VIDEO","durationSeconds":2,"required":true}' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/modules/$MODULE_ID/lessons")
          [[ "$code" == "201" ]] || { echo "Criar aula VIDEO: $code"; exit 1; }
          VIDEO_ID=$(jq -r '.id' /tmp/ci-video-lesson.json)
          code=$(curl -sS -o /tmp/ci-after-video.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Aula depois do vídeo","kind":"TEXT","bodyText":"Conteúdo só liberado depois dos cem por cento","durationSeconds":50,"required":true}' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/modules/$MODULE_ID/lessons")
          [[ "$code" == "201" ]] || { echo "Criar terceira aula: $code"; exit 1; }
          printf '\x00\x00\x00\x18ftypisom' > /tmp/ci-video.mp4
          code=$(curl -sS -o /tmp/ci-asset-video.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            -F 'file=@/tmp/ci-video.mp4;type=video/mp4' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/assets?lessonId=$VIDEO_ID")
          [[ "$code" == "201" ]] || { echo "Upload vídeo: $code"; cat /tmp/ci-asset-video.json; exit 1; }
          printf '%%PDF-1.7\\nMaterial de curso' > /tmp/ci-material.pdf
          code=$(curl -sS -o /tmp/ci-asset-pdf.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            -F 'file=@/tmp/ci-material.pdf;type=application/pdf' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/assets")
          [[ "$code" == "201" ]] || { echo "Upload PDF: $code"; cat /tmp/ci-asset-pdf.json; exit 1; }
          PDF_ASSET_ID=$(jq -r '.id' /tmp/ci-asset-pdf.json)

          code=$(curl -sS -o /tmp/published-course.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/publish")
          [[ "$code" == "200" ]] || { echo "Publicar curso: $code"; cat /tmp/published-course.json; exit 1; }
          jq -e '.status == "PUBLICADO"' /tmp/published-course.json >/dev/null

          code=$(curl -sS -o /tmp/readonly-module.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" \
            -H 'Content-Type: application/json' -d '{"title":"Modulo posterior"}' \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/modules")
          [[ "$code" == "409" ]] || { echo "Editar publicado: $code (esperado 409)"; exit 1; }

          code=$(curl -sS -o /tmp/course-public.json -w '%{http_code}' \
            "http://localhost:8080/api/v1/courses/curso-publicado-instrutor-ci")
          [[ "$code" == "200" ]] || { echo "Curso publicado no catálogo: $code"; exit 1; }

          # Segundo instrutor ativo com senha de teste copiada APENAS no banco temporário do CI.
          docker exec -i "$POSTGRES_CONTAINER" psql -X -U cursohub -d cursohub_ci -v ON_ERROR_STOP=1 <<SQL
          UPDATE app_users SET is_active = TRUE,
            password_hash = (SELECT password_hash FROM app_users WHERE email = 'segunda.aluna@example.com')
            WHERE email = 'instrutor-ci@example.com' AND role = 'INSTRUCTOR';
          SQL

          code=$(curl -sS -o /tmp/other-instructor-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"instrutor-ci@example.com","password":"SenhaForteCI#2026"}' \
            http://localhost:8080/api/v1/auth/login)
          [[ "$code" == "200" ]] || { echo "Segundo instrutor: $code"; exit 1; }
          OTHER_INSTRUCTOR_TOKEN=$(jq -r '.accessToken' /tmp/other-instructor-login.json)

          code=$(curl -sS -o /tmp/other-instructor-course.json -w '%{http_code}' \
            -H "Authorization: Bearer $OTHER_INSTRUCTOR_TOKEN" \
            "$INSTRUCTOR_URL/$OWN_COURSE_ID/content")
          [[ "$code" == "404" ]] || { echo "Isolamento entre instrutores: $code (esperado 404)"; exit 1; }

          echo 'Smoke test OK: instrutor, rascunho, modulos, aulas, publicacao e isolamento.'
          # Inscrição em curso real e desbloqueio sequencial sem permitir skips.
          code=$(curl -sS -o /tmp/enroll-instructor-course.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "http://localhost:8080/api/v1/courses/curso-publicado-instrutor-ci/enrollments")
          [[ "$code" == "201" ]] || { echo "Aluno matricula curso novo: $code"; exit 1; }
          # Regressão: listar materiais, inclusive cursos SEM anexos (bug SQL 500).
          ASSETS_CI="http://localhost:8080/api/v1/students/me/courses/curso-publicado-instrutor-ci/assets"
          code=$(curl -sS -o /tmp/ci-assets-list.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$ASSETS_CI")
          [[ "$code" == "200" ]] || { echo "Listagem de materiais: $code (esperado 200)"; cat /tmp/ci-assets-list.json; exit 1; }
          jq -e --arg pdf "$PDF_ASSET_ID" --arg video "$VIDEO_ID"             'any(.[]; .id == $pdf and .mediaType == "application/pdf") and any(.[]; .lessonId == $video and .mediaType == "video/mp4")'             /tmp/ci-assets-list.json >/dev/null

          code=$(curl -sS -o /tmp/ci-assets-empty.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "http://localhost:8080/api/v1/students/me/courses/curso-teste-dashboard/assets")
          [[ "$code" == "200" ]] || { echo "Curso sem anexos: $code (esperado 200)"; exit 1; }
          jq -e 'type == "array" and length == 0' /tmp/ci-assets-empty.json >/dev/null
          code=$(curl -sS -o /tmp/ci-assets-forbidden.json -w '%{http_code}' "$ASSETS_CI")
          [[ "$code" == "401" ]] || { echo "Listar sem JWT: $code (esperado 401)"; exit 1; }

          LESSONS_CI="http://localhost:8080/api/v1/students/me/courses/curso-publicado-instrutor-ci/lessons"
          code=$(curl -sS -o /tmp/ci-locked.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$LESSONS_CI")
          [[ "$code" == "200" ]] || { echo "Lições novo curso: $code"; exit 1; }
          jq -e '.modules[0].lessons | length == 3 and .[0].locked == false and .[1].locked == true and .[2].locked == true' /tmp/ci-locked.json >/dev/null
          code=$(curl -sS -o /tmp/ci-forbidden-manual.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$LESSONS_CI/$VIDEO_ID/complete")
          [[ "$code" == "404" ]] || { echo "Conclusão manual VIDEO: $code (esperado 404)"; exit 1; }
          code=$(curl -sS -o /tmp/ci-forbidden-next.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "$LESSONS_CI/$(jq -r '.id' /tmp/ci-after-video.json)/complete")
          [[ "$code" == "404" ]] || { echo "Pular aula obrigatória: $code"; exit 1; }
          code=$(curl -sS -o /tmp/ci-complete-first.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "$LESSONS_CI/$(jq -r '.id' /tmp/new-lesson.json)/complete")
          [[ "$code" == "200" ]] || { echo "Conclusão TEXT inicial: $code"; exit 1; }
          VIDEO_URL="$LESSONS_CI/$VIDEO_ID/video-progress"
          code=$(curl -sS -o /tmp/ci-watch0.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"seconds":0}' "$VIDEO_URL")
          [[ "$code" == "200" ]] || { echo "Inicialização progresso vídeo: $code"; exit 1; }
          code=$(curl -sS -o /tmp/ci-jump.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"seconds":2}' "$VIDEO_URL")
          [[ "$code" == "200" ]] || { echo "Teste pulo vídeo: $code"; exit 1; }
          jq -e '.completed == false and .watchedSeconds == 0' /tmp/ci-jump.json >/dev/null
          sleep 3
          code=$(curl -sS -o /tmp/ci-watch2.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"seconds":2}' "$VIDEO_URL")
          [[ "$code" == "200" ]] || { echo "Registrar vídeo completo: $code"; exit 1; }
          jq -e '.completed == true and .percent == 100' /tmp/ci-watch2.json >/dev/null
          code=$(curl -sS -o /tmp/ci-unlocked.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$LESSONS_CI")
          [[ "$code" == "200" ]] || { echo "Lições após assistir vídeo: $code"; exit 1; }
          jq -e '.modules[0].lessons[2].locked == false' /tmp/ci-unlocked.json >/dev/null
          code=$(curl -sS -o /tmp/ci-pdf-downloaded -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "http://localhost:8080/api/v1/students/me/courses/curso-publicado-instrutor-ci/assets/$PDF_ASSET_ID")
          [[ "$code" == "200" ]] || { echo "Baixar PDF matriculado: $code"; exit 1; }
          code=$(curl -sS -o /tmp/ci-pdf-no-auth -w '%{http_code}' \
            "http://localhost:8080/api/v1/students/me/courses/curso-publicado-instrutor-ci/assets/$PDF_ASSET_ID")
          [[ "$code" == "401" ]] || { echo "PDF sem JWT: $code"; exit 1; }
          echo 'Smoke test OK: anexos autenticados, liberação sequencial e vídeo completo 100%.'
          # Retrocompatibilidade: curso antigo sem avaliação nem certificado.
          LEGACY_COURSE="http://localhost:8080/api/v1/students/me/courses/curso-teste-dashboard"
          code=$(curl -sS -o /tmp/legacy-quiz.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$LEGACY_COURSE/assessment")
          [[ "$code" == "200" ]] || { echo "Curso sem avaliação: $code"; exit 1; }
          jq -e 'type == "null"' /tmp/legacy-quiz.json >/dev/null
          code=$(curl -sS -o /tmp/legacy-certificate.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$LEGACY_COURSE/certificate")
          [[ "$code" == "200" ]] || { echo "Curso sem certificado: $code"; exit 1; }
          jq -e 'type == "null"' /tmp/legacy-certificate.json >/dev/null
          # O curso legado concluiu suas duas aulas obrigatórias nos testes anteriores:
          # Sem avaliação obrigatória, pode emitir certificado normalmente.
          code=$(curl -sS -o /tmp/legacy-cert-issued.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$LEGACY_COURSE/certificate")
          [[ "$code" == "200" ]] || { echo "Certificado de curso sem avaliação: $code"; cat /tmp/legacy-cert-issued.json; exit 1; }
          jq -e '(.verificationCode|length)==36' /tmp/legacy-cert-issued.json >/dev/null

          # Etapa 8 — avaliação e emissão de certificados sem expor gabarito.
          code=$(curl -sS -o /tmp/quiz-course.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"slug":"curso-avaliacao-ci","title":"Curso Avaliação CI","description":"Curso de teste para validar provas e certificados","category":"Programação","level":"INICIANTE","estimatedMinutes":40}' \
            "$INSTRUCTOR_URL")
          [[ "$code" == "201" ]] || { echo "Criar curso avaliação: $code"; cat /tmp/quiz-course.json; exit 1; }
          EVAL_COURSE=$(jq -r '.id' /tmp/quiz-course.json)
          code=$(curl -sS -o /tmp/quiz-module.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Primeiros passos"}' "$INSTRUCTOR_URL/$EVAL_COURSE/modules")
          [[ "$code" == "201" ]] || { echo "Criar modulo avaliação: $code"; exit 1; }
          EVAL_MODULE=$(jq -r '.id' /tmp/quiz-module.json)
          code=$(curl -sS -o /tmp/quiz-lesson.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Introdução CI","kind":"TEXT","bodyText":"Introdução ao curso e questões finais.","durationSeconds":60,"required":true}' \
            "$INSTRUCTOR_URL/$EVAL_COURSE/modules/$EVAL_MODULE/lessons")
          [[ "$code" == "201" ]] || { echo "Criar aula avaliação: $code"; exit 1; }
          EVAL_LESSON=$(jq -r '.id' /tmp/quiz-lesson.json)

          EVAL_AUTHOR="$INSTRUCTOR_URL/$EVAL_COURSE/assessment"
          code=$(curl -sS -o /tmp/quiz-invalid.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Prova inválida","passingScore":70,"maxAttempts":2,"questions":[{"statement":"Pergunta com duas corretas?","options":[{"text":"A","correct":true},{"text":"B","correct":true}]}]}' \
            "$EVAL_AUTHOR")
          [[ "$code" == "400" ]] || { echo "Duas alternativas corretas: $code (esperado 400)"; exit 1; }

          code=$(curl -sS -o /tmp/quiz-created.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Avaliação de Java CI","passingScore":70,"maxAttempts":2,"questions":[{"statement":"O que executa bytecode Java?","options":[{"text":"A JVM","correct":true},{"text":"Um cliente HTTP","correct":false}]}]}' \
            "$EVAL_AUTHOR")
          [[ "$code" == "201" ]] || { echo "Criar prova: $code"; cat /tmp/quiz-created.json; exit 1; }
          QUIZ_ID=$(jq -r '.id' /tmp/quiz-created.json)
          # Gabarito não pode sair sequer na resposta de autoria.
          jq -e '.passingScore == 70 and .maxAttempts == 2 and (.questions|length)==1 and
            ([.. | objects | keys[] | select(. == "correct" or . == "isCorrect")] | length)==0' \
            /tmp/quiz-created.json >/dev/null

          code=$(curl -sS -o /tmp/quiz-duplicate.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Avaliação repetida","passingScore":70,"maxAttempts":2,"questions":[{"statement":"Pergunta duplicada","options":[{"text":"A","correct":true},{"text":"B","correct":false}]}]}' \
            "$EVAL_AUTHOR")
          [[ "$code" == "409" ]] || { echo "Prova duplicada: $code (esperado 409)"; exit 1; }

          code=$(curl -sS -o /tmp/quiz-published.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $INSTRUCTOR_TOKEN" "$INSTRUCTOR_URL/$EVAL_COURSE/publish")
          [[ "$code" == "200" ]] || { echo "Publicar curso avaliação: $code"; exit 1; }

          EVAL_STUDENT="http://localhost:8080/api/v1/students/me/courses/curso-avaliacao-ci"
          code=$(curl -sS -o /tmp/quiz-enroll.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "http://localhost:8080/api/v1/courses/curso-avaliacao-ci/enrollments")
          [[ "$code" == "201" ]] || { echo "Matricular avaliação: $code"; exit 1; }
          code=$(curl -sS -o /tmp/quiz-anonymous.json -w '%{http_code}' "$EVAL_STUDENT/assessment")
          [[ "$code" == "401" ]] || { echo "Questões sem JWT: $code"; exit 1; }
          code=$(curl -sS -o /tmp/quiz-student.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$EVAL_STUDENT/assessment")
          [[ "$code" == "200" ]] || { echo "Questões matriculado: $code"; exit 1; }
          jq -e '.attemptsUsed == 0 and .passed == false and
            ([.. | objects | keys[] | select(. == "correct" or . == "isCorrect")] | length)==0' \
            /tmp/quiz-student.json >/dev/null
          QUESTION_ID=$(jq -r '.questions[0].id' /tmp/quiz-student.json)
          CORRECT_ID=$(jq -r '.questions[0].options[0].id' /tmp/quiz-student.json)
          INCORRECT_ID=$(jq -r '.questions[0].options[1].id' /tmp/quiz-student.json)

          code=$(curl -sS -o /tmp/quiz-early.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"answers\":[{\"questionId\":\"$QUESTION_ID\",\"optionId\":\"$CORRECT_ID\"}]}" \
            "$EVAL_STUDENT/assessment/$QUIZ_ID/attempts")
          [[ "$code" == "409" ]] || { echo "Prova antes das aulas: $code"; exit 1; }
          code=$(curl -sS -o /tmp/certificate-early.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$EVAL_STUDENT/certificate")
          [[ "$code" == "409" ]] || { echo "Certificado antes de aulas: $code"; exit 1; }

          code=$(curl -sS -o /tmp/eval-complete.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "$EVAL_STUDENT/lessons/$EVAL_LESSON/complete")
          [[ "$code" == "200" ]] || { echo "Concluir aula avaliação: $code"; exit 1; }

          code=$(curl -sS -o /tmp/quiz-wrong.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"answers\":[{\"questionId\":\"$QUESTION_ID\",\"optionId\":\"$INCORRECT_ID\"}]}" \
            "$EVAL_STUDENT/assessment/$QUIZ_ID/attempts")
          [[ "$code" == "200" ]] || { echo "Tentativa incorreta: $code"; cat /tmp/quiz-wrong.json; exit 1; }
          jq -e '.passed == false and .score == 0 and .number == 1 and .attemptsRemaining == 1' /tmp/quiz-wrong.json >/dev/null
          code=$(curl -sS -o /tmp/certificate-failed.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$EVAL_STUDENT/certificate")
          [[ "$code" == "409" ]] || { echo "Certificado sem aprovação: $code"; exit 1; }

          code=$(curl -sS -o /tmp/quiz-pass.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"answers\":[{\"questionId\":\"$QUESTION_ID\",\"optionId\":\"$CORRECT_ID\"}]}" \
            "$EVAL_STUDENT/assessment/$QUIZ_ID/attempts")
          [[ "$code" == "200" ]] || { echo "Tentativa correta: $code"; cat /tmp/quiz-pass.json; exit 1; }
          jq -e '.passed == true and .score == 100 and .number == 2 and .attemptsRemaining == 0' /tmp/quiz-pass.json >/dev/null

          code=$(curl -sS -o /tmp/quiz-retake.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"answers\":[{\"questionId\":\"$QUESTION_ID\",\"optionId\":\"$CORRECT_ID\"}]}" \
            "$EVAL_STUDENT/assessment/$QUIZ_ID/attempts")
          [[ "$code" == "409" ]] || { echo "Terceira tentativa proibida: $code"; exit 1; }

          code=$(curl -sS -o /tmp/cert-issued.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$EVAL_STUDENT/certificate")
          [[ "$code" == "200" ]] || { echo "Emitir certificado: $code"; cat /tmp/cert-issued.json; exit 1; }
          jq -e '.studentName == "Aluno CI" and .courseTitle == "Curso Avaliação CI" and
            (.verificationCode|length)==36' /tmp/cert-issued.json >/dev/null
          CERT_CODE=$(jq -r '.verificationCode' /tmp/cert-issued.json)

          code=$(curl -sS -o /tmp/cert-repeat.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $TOKEN" "$EVAL_STUDENT/certificate")
          [[ "$code" == "200" ]] || { echo "Emissão idempotente: $code"; exit 1; }
          jq -e --arg code "$CERT_CODE" '.verificationCode == $code' /tmp/cert-repeat.json >/dev/null
          code=$(curl -sS -o /tmp/cert-verify.json -w '%{http_code}' \
            "http://localhost:8080/api/v1/certificates/verify/$CERT_CODE")
          [[ "$code" == "200" ]] || { echo "Verificação pública: $code"; exit 1; }
          jq -e --arg code "$CERT_CODE" '.verificationCode == $code' /tmp/cert-verify.json >/dev/null
          code=$(curl -sS -o /tmp/cert-noauth.json -w '%{http_code}' "$EVAL_STUDENT/certificate")
          [[ "$code" == "401" ]] || { echo "Certificado privado sem JWT: $code"; exit 1; }

          echo 'Smoke test OK: avaliação 0/100%, tentativas, permissão, certificado idempotente e verificação.'


  docker-parity-flyway-smoke:
    name: Flyway V1 + V2 demo + V3 media
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cursohub_demo_ci
          POSTGRES_USER: cursohub
          POSTGRES_PASSWORD: cursohub_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cursohub -d cursohub_demo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cursohub_demo_ci
      DB_USER: cursohub
      DB_PASSWORD: cursohub_ci_only
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
      PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Iniciar API com configuração de Flyway do Docker
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          key=$(openssl rand -base64 32 | tr -d '\n')
          echo "::add-mask::$key"
          export JWT_SECRET_BASE64="$key"
          mvn -B -ntp spring-boot:run > /tmp/cursohub-demo-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | jq -e '.status == "UP"' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            echo "Backend falhou ao inicializar com as migrations de demonstração:"
            tail -130 /tmp/cursohub-demo-ci.log
            exit 1
          fi

          curl -fsS http://localhost:8080/api/v1/courses \
            | jq -e '.totalElements == 4' >/dev/null

          postgres_container=$(docker ps --filter ancestor=postgres:17-alpine -q | head -1)
          [[ -n "$postgres_container" ]] || { echo "PostgreSQL de teste não encontrado"; exit 1; }

          applied=$(docker exec "$postgres_container" psql -X -U cursohub -d cursohub_demo_ci -tA \
            -c "SELECT string_agg(version, ',' ORDER BY installed_rank) FROM flyway_schema_history WHERE success=true")
          [[ "$applied" == "1,2,3" ]] || {
            echo "Migrações inesperadas. Obtidas: $applied; esperadas: 1,2,3"
            exit 1
          }

          tables=$(docker exec "$postgres_container" psql -X -U cursohub -d cursohub_demo_ci -tA \
            -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('course_assets','video_playback_progress')")
          [[ "$tables" == "2" ]] || { echo "Tabelas da V3 não foram encontradas"; exit 1; }

          echo "Flyway e catálogo demonstrativo OK: V1, V2 demo, V3 media."
