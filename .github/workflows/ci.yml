name: CursoHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/course-cover-upload, feature/course-pricing-loyalty, feature/home-premium-redesign]

permissions:
  contents: read

jobs:
  backend:
    name: Java 21 - Maven Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testar backend
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Validar fronteiras arquiteturais
        run: python3 scripts/check_architecture.py

  frontend:
    name: React - TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Compilar frontend
        working-directory: frontend
        run: npm run build
