services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cursohub}
      POSTGRES_USER: ${POSTGRES_USER:-cursohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crie um arquivo .env com POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cursohub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cursohub}
      DB_USER: ${POSTGRES_USER:-cursohub}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Crie um arquivo .env com POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  cursohub_pgdata:
